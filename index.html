<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши услуги | Стамбул</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #080b12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at top right, #1f2937, #080b12);
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            flex: 1;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 300px;
        }

        /* Стиль для вашей карточки (ИИ и сайты) */
        .card.ai-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
        }

        .card.ai-card h2 {
            background: linear-gradient(90deg, #00f0ff, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Стиль для карточки Алёны (Стиль и волосы) */
        .card.hair-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(223, 194, 96, 0.2); /* Тень в тон нового цвета */
            border-color: #DFC260; /* Золотая рамка при наведении */
        }

        .card.hair-card h2 {
            /* Золотой градиент из левого нижнего в правый верхний угол */
            background: linear-gradient(to top right, #EBD78E, #DFC260);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 800;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        /* Адаптивность для телефонов */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .card {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card ai-card" onclick="sendOrder('Web/AI (Алина)')" style="cursor: pointer;">
            <h2>Алина</h2>
            <p>Web-разработка и ИИ для бизнеса</p>
        </div>

        <div class="card hair-card" onclick="sendOrder('Стилист (Алёна)')" style="cursor: pointer;">
            <h2>Алёна</h2>
            <p>Hair-стилист | Окрашивание и уход</p>
        </div>
    </div>

</body>
</html>

</body>
</html>
